name: Build RPM Packages

on:
  push:
    branches: [main, gtk4]
    tags: ['v*']
  pull_request:
    branches: [main, gtk4]

jobs:
  build-rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 44 x86_64
            container: fedora:44
            arch: x86_64
          - name: Fedora 43 x86_64
            container: fedora:43
            arch: x86_64
          - name: EL10 x86_64
            container: almalinux:10
            arch: x86_64
          - name: Fedora 44 aarch64
            container: fedora:44
            arch: aarch64
          - name: Fedora 43 aarch64
            container: fedora:43
            arch: aarch64
          - name: EL10 aarch64
            container: almalinux:10
            arch: aarch64

    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # openh264 repo mirrors are unreliable in containers; we do not
          # need it, so disable it for this install
          dnf install -y --disablerepo=openh264 \
            gcc \
            make \
            vala \
            gtk4-devel \
            libadwaita-devel \
            iniparser-devel \
            gettext \
            pkg-config \
            rpm-build \
            rpmdevtools

      - name: Create source tarball
        run: |
          VERSION=$(grep '^Version:' scripts/gtk4/isomaster-gtk4.spec | awk '{print $2}')
          PKG_NAME="isomaster-gtk4-${VERSION}"
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar cjf "/tmp/rpmbuild/SOURCES/${PKG_NAME}.tar.bz2" \
            --transform "s,^\.,${PKG_NAME}," \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.mo' \
            --exclude='isomaster.c' \
            --exclude='settings.c' \
            --exclude='file-item.c' \
            --exclude='iso-operations.c' \
            --exclude='util.c' \
            --exclude='isomaster' \
            --exclude='iconpath.c' \
            --exclude='iconpath.h' \
            --exclude='version.inc' \
            --exclude='test_bk' \
            .

      - name: Run bk unit tests
        run: |
          cd tests && ./run_tests.sh

      - name: Run tests with AddressSanitizer
        run: |
          # libasan is only a weak dependency of gcc; the linker needs the
          # actual runtime library to build with -fsanitize=address
          dnf install -y --disablerepo=openh264 libasan
          make -C bk clean
          make -C bk CFLAGS+="-fsanitize=address -g"
          cd tests
          gcc -fsanitize=address -g -Wall -I../bk test_bk.c ../bk/bk.a -o test_bk_asan
          ASAN_OPTIONS=detect_leaks=0 ./test_bk_asan
          rm -f test_bk_asan
          cd .. && make -C bk clean && make -C bk

      - name: Static analysis (cppcheck, informational)
        run: |
          dnf install -y --disablerepo=openh264 cppcheck || true
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --quiet bk/ || true

      - name: Build RPM packages
        run: |
          rpmbuild -ba \
            --define "_topdir /tmp/rpmbuild" \
            scripts/gtk4/isomaster-gtk4.spec

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.name }}
          path: |
            /tmp/rpmbuild/RPMS/**/*.rpm
            /tmp/rpmbuild/SRPMS/**/*.rpm
          retention-days: 7

  release:
    needs: build-rpm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.rpm
